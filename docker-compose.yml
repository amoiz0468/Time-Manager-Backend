version: '3.8'

services:
  # Elixir Phoenix application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - deps:/app/deps
      - build:/app/_build
    depends_on:
      - db
    environment:
      - MIX_ENV=dev
      - DATABASE_URL=postgres://postgres:postgres@db:5432/time_manager_api_dev
      # Use this environment variable to control which database to connect to
      - DB_HOST=${DB_HOST:-db}
    networks:
      - app_network

  # PostgreSQL database
  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"  # Map to a different port to avoid conflicts with local PostgreSQL
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=time_manager_api_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

volumes:
  postgres_data:
  deps:
  build:

networks:
  app_network: